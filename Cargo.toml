[package]
name = "ut"
version = "0.1.3"
edition = "2021"
license = "MIT"

[features]
default = ["audio-capture", "ui"]
audio-capture = ["dep:cpal", "dep:nnnoiseless"]
ui = [
    "dep:raw-window-handle",
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wgpu",
    "dep:nnnoiseless",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.17", optional = true }
libc = "0.2"
nnnoiseless = { version = "0.5", optional = true, default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
raw-window-handle = { version = "0.6.2", optional = true }
wgpu = { version = "29.0.3", optional = true }
smithay-client-toolkit = { version = "0.20.0", optional = true, default-features = false }
wayland-client = { version = "0.31.14", optional = true, features = ["system"] }
